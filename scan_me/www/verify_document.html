<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Verify Document</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 1rem; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin-bottom: 1rem; border-radius: 0.5rem; border: 1px solid #ccc; }
        button { padding: 10px 20px; border: none; border-radius: 0.5rem; background: #3b82f6; color: white; cursor: pointer; font-weight: bold; margin: 0 5px; }
        .result { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; font-weight: bold; }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Verify Document</h2>
        <input id="uuid_input" type="text" placeholder="Enter or scan UUID">
        <div>
            <button onclick="verifyDocument()">Verify</button>
            <button onclick="startScan()">Scan QR</button>
        </div>
        <div id="camera_container" style="margin-top: 10px;"></div>
        <div id="result_box"></div>
    </div>

    <!-- Include local Html5Qrcode library -->
    <script src="/assets/scan_me/js/html5-qrcode.min.js"></script>

    <script>
        function verifyDocument() {
            const uuid = document.getElementById("uuid_input").value.trim();
            const resultBox = document.getElementById("result_box");

            if (!uuid) {
                resultBox.innerHTML = "<div class='result error'>Please enter a UUID.</div>";
                return;
            }

            fetch(`/api/method/scan_me.api.verified_qr.verify_qr?uuid=${uuid}`)
                .then(res => res.json())
                .then(r => {
                    const data = r.message;
                    if (data && data.status === "valid") {
                        uuid.value = "";
                        resultBox.innerHTML = `<div class='result success'>
                            ✅ Verified! <br>
                            Document: ${data.ref_doctype} - ${data.ref_docname}
                        </div>`;
                    } else {
                        resultBox.innerHTML = "<div class='result error'>Invalid or Unverified QR</div>";
                    }
                }).catch(err => {
                    resultBox.innerHTML = "<div class='result error'>Error verifying UUID</div>";
                    console.error(err);
                });
        }

        function startScan() {
            const cameraContainer = document.getElementById("camera_container");
            cameraContainer.innerHTML = ""; // clear previous

            const html5QrCode = new Html5Qrcode("camera_container");

            Html5Qrcode.getCameras().then(cameras => {
                if (cameras && cameras.length) {
                    const cameraId = cameras[0].id;

                    html5QrCode.start(
                        cameraId,
                        { fps: 10, qrbox: 250 },
                        qrCodeMessage => {
                            html5QrCode.stop().then(() => {
                                const uuidInput = document.getElementById("uuid_input");
                                uuidInput.value = "";
                                uuidInput.value = qrCodeMessage;
                                verifyDocument(); // automatically verify
                                setTimeout(() => { uuidInput.value = ""; }, 500);
                            }).catch(err => console.error(err));
                        },
                        errorMessage => {
                            window.console.log(`QR Code no read: ${errorMessage}`);
                            window.alert("Failed to read QR Code. Please try again.");
                        }
                    );
                } else {
                    alert("No camera found!");
                }
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
