<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="robots" content="noindex">
    <!--
        CSP lock-down for a public, unauthenticated page. The client renders every
        server-supplied field via .textContent (no innerHTML), so XSS isn't an
        active risk today — this policy is defense-in-depth so a future edit that
        accidentally switches to innerHTML can't escalate, and so any third-party
        script that gets injected (e.g. via a browser extension or HTML cache
        poisoning) can't exfiltrate scanned UUIDs to an external endpoint.
        data: is allowed for img-src because the scanner libs emit data URIs.
        frame-ancestors is omitted — it cannot be set via <meta> and this page
        isn't a high-value clickjacking target.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; form-action 'self'; base-uri 'self'; object-src 'none'">
    <!--
        no-referrer so a scanned UUID never leaks to any third-party origin the
        user might click through to from the verify page.
    -->
    <meta name="referrer" content="no-referrer">
    <title>Verify Document</title>
    <link rel="stylesheet" href="/verify_document/verify_document.css">
    <script src="/assets/scan_me/js/html5-qrcode.min.js" defer></script>
</head>
<body>
    <main class="page" role="main">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <path d="M14 14h3v3h-3zM20 14v7M14 20h7"></path>
                </svg>
            </div>
            <h1>Document Verification</h1>
            <p class="subtitle">Scan the QR code on a document to verify its authenticity.</p>
        </header>

        <section class="card" aria-labelledby="scan-heading">
            <h2 id="scan-heading" class="sr-only">Scan or enter code</h2>

            <div id="scanner-wrap" class="scanner-wrap" aria-live="polite"></div>

            <div class="action-row">
                <button id="scan-btn" class="btn btn-primary" type="button">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <span id="scan-btn-label">Scan QR Code</span>
                </button>
                <button id="stop-btn" class="btn btn-ghost" type="button" hidden>Stop</button>
            </div>

            <details class="manual-entry">
                <summary>Enter code manually</summary>
                <form id="manual-form" class="manual-form" novalidate>
                    <input id="uuid-input" type="text" class="input" placeholder="Paste or type the code" autocomplete="off" spellcheck="false">
                    <button class="btn btn-secondary" type="submit">Verify</button>
                </form>
            </details>
        </section>

        <section id="result" class="result" role="status" aria-live="polite" hidden></section>

        <footer class="foot">
            <p>Powered by <strong>Scan Me</strong></p>
        </footer>
    </main>

    <template id="tpl-verified">
        <div class="state state-ok">
            <div class="state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h3 class="state-title">Document Authentic</h3>
            <p class="state-message"></p>
            <dl class="details"></dl>
            <button class="btn btn-ghost again" type="button">Scan another</button>
        </div>
    </template>

    <template id="tpl-tampered">
        <div class="state state-warn">
            <div class="state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h3 class="state-title">Signature Invalidated</h3>
            <p class="state-message"></p>
            <dl class="details"></dl>
            <button class="btn btn-ghost again" type="button">Scan another</button>
        </div>
    </template>

    <template id="tpl-invalid">
        <div class="state state-muted">
            <div class="state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <h3 class="state-title">Not Recognised</h3>
            <p class="state-message"></p>
            <button class="btn btn-ghost again" type="button">Try again</button>
        </div>
    </template>

    <script src="/verify_document/verify_document.js" defer></script>
</body>
</html>
